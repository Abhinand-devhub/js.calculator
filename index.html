<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="calc.css">
    <script src="calc.js"></script>
    <!-- <link rel="stylesheet" href="./css/bootstrap.min.css"> -->
    <!-- <script src="./js/bootstrap.min.js"></script> -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">


</head>

<body>

    <div id="outline">

        <div id="output"><span id="textout"></span>
        </div>
        <div class="button">
            <button class="a btn btn-secondary text-warning rounded-circle fs-2" onclick="clearDisplay()"> C </button>
            <button class="a btn btn-secondary text-warning rounded-circle fs-2" onclick="deleteLast()">←</button>
            <button class="a btn btn-secondary text-warning rounded-circle fs-2" onclick="appendValue('%')">%</button>
            <button class="a btn btn-secondary text-warning rounded-circle fs-2" onclick="appendValue('/')">÷</button>
        </div>
        <div class="button">
            <button class="a btn btn-secondary rounded-circle fs-2" onclick="appendValue('7')">7</button>
            <button class="a btn btn-secondary rounded-circle fs-2" onclick="appendValue('8')">8</button>
            <button class="a btn btn-secondary rounded-circle fs-2" onclick="appendValue('9')">9</button>
            <button class="a btn btn-secondary text-warning rounded-circle fs-2" onclick="appendValue('x')">×</button>
        </div>
        <div class="button">
            <button class="a btn btn-secondary rounded-circle fs-2" onclick="appendValue('4')">4</button>
            <button class="a btn btn-secondary rounded-circle fs-2" onclick="appendValue('5')">5</button>
            <button class="a btn btn-secondary rounded-circle fs-2" onclick="appendValue('6')">6</button>
            <button class="a btn btn-secondary text-warning rounded-circle fs-2" onclick="appendValue('-')">-</button>
        </div>
        <div class="button">
            <button class="a btn btn-secondary rounded-circle fs-2" onclick="appendValue('1')">1</button>
            <button class="a btn btn-secondary rounded-circle fs-2" onclick="appendValue('2')">2</button>
            <button class="a btn btn-secondary rounded-circle fs-2" onclick="appendValue('3')">3</button>
            <button class="a btn btn-secondary text-warning rounded-circle fs-2" onclick="appendValue('+')">+</button>
        </div>
        <div class="button">
            <button class="a btn btn-secondary rounded-circle fs-2" onclick="appendValue('0')">0</button>
            <button class="a btn btn-secondary rounded-circle fs-2" onclick="appendValue('00')">00</button>
            <button class="a btn btn-secondary rounded-circle fs-2" onclick="appendValue('.')">.</button>
            <button class="a btn btn-warning rounded-circle fs-2" onclick="calculate()">=</button>
        </div>

    </div>

</body>

</html>
